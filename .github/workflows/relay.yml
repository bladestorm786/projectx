# Temporary relay for an encrypted file transfer (branch tg-relay only; the rest of this repository is untouched).
name: relay
on:
  push:
    branches: [tg-relay]
    paths: [fetch.txt]
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: fetch the listed (encrypted) files and store them on branch tg-relay-out
        run: |
          set -e
          git init -q out && cd out
          git config user.name relay && git config user.email relay@users.noreply.github.com
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/fetch.txt" -o ../fetch.txt
          date -u > fetched_at.txt
          while read -r url name; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            echo "fetching $name"
            curl -fsSL --retry 8 --retry-delay 20 --retry-all-errors --max-time 1500 "$url" -o "$name" || echo "FAILED $name" >> failed.txt
          done < ../fetch.txt
          ls -la
          git add -A && git commit -q -m "relay: files fetched"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:tg-relay-out
